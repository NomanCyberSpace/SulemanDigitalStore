<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suleman Digital Store - Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://kvcqsmqqcmlbgrtgoeca.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2Y3FzbXFxY21sYmdydGdvZWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTMwMTksImV4cCI6MjEwMTU4OTAxOX0.BzNIMNu1LhEGAuvm8Wq1ka9hm-n6yq7VNjrO6m2vgdE';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const SECURITY_KEY = "digitalbreach";

        function App() {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [usernameInput, setUsernameInput] = React.useState('');
            const [passwordInput, setPasswordInput] = React.useState('');

            const [products, setProducts] = React.useState([]);
            const [orders, setOrders] = React.useState([]);
            const [reports, setReports] = React.useState([]);
            const [humanContacts, setHumanContacts] = React.useState([]);
            const [approvals, setApprovals] = React.useState([]);
            const [teamUsers, setTeamUsers] = React.useState([]);
            const [chatMessages, setChatMessages] = React.useState([]);

            const [activeTab, setActiveTab] = React.useState('orders');
            const [searchQuery, setSearchQuery] = React.useState('');

            // Forms State
            const [newName, setNewName] = React.useState('');
            const [newDesc, setNewDesc] = React.useState('');
            const [newPrice, setNewPrice] = React.useState('');
            const [newStock, setNewStock] = React.useState('');

            const [teamUser, setTeamUser] = React.useState('');
            const [teamPass, setTeamPass] = React.useState('');

            const [secKeyInput, setSecKeyInput] = React.useState('');
            const [newAdminPass, setNewAdminPass] = React.useState('');

            const [chatInput, setChatInput] = React.useState('');
            const [discountInputs, setDiscountInputs] = React.useState({});

            React.useEffect(() => {
                fetchTeamUsers();
            }, []);

            React.useEffect(() => {
                if (currentUser) {
                    fetchAllData();
                    const interval = setInterval(fetchAllData, 4000);
                    return () => clearInterval(interval);
                }
            }, [currentUser]);

            const fetchAllData = () => {
                fetchProducts();
                fetchOrders();
                fetchReports();
                fetchHumanContacts();
                fetchApprovals();
                fetchChatMessages();
            };

            const fetchTeamUsers = async () => {
                const { data } = await supabaseClient.from('team_accounts').select('*');
                if (data && data.length > 0) {
                    setTeamUsers(data);
                } else {
                    setTeamUsers([{ username: 'suleman', password: 'suleman321', role: 'admin' }]);
                }
            };

            const fetchProducts = async () => {
                const { data } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
                setProducts(data || []);
            };

            const fetchOrders = async () => {
                const { data } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
                setOrders(data || []);
            };

            const fetchReports = async () => {
                const { data } = await supabaseClient.from('reports').select('*').order('created_at', { ascending: false });
                setReports(data || []);
            };

            const fetchHumanContacts = async () => {
                const { data } = await supabaseClient.from('human_contacts').select('*').order('created_at', { ascending: false });
                setHumanContacts(data || []);
            };

            const fetchApprovals = async () => {
                const { data } = await supabaseClient.from('stock_approvals').select('*').order('created_at', { ascending: false });
                setApprovals(data || []);
            };

            const fetchChatMessages = async () => {
                const { data } = await supabaseClient.from('internal_messages').select('*').order('created_at', { ascending: true });
                setChatMessages(data || []);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const uText = usernameInput.trim().toLowerCase();
                const pText = passwordInput.trim();

                if ((uText === 'suleman' || uText === 'suleman123') && pText === 'suleman321') {
                    setCurrentUser({ username: 'suleman', role: 'admin' });
                    return;
                }

                const found = teamUsers.find(u => u.username.toLowerCase() === uText && u.password === pText);
                if (found) {
                    setCurrentUser(found);
                } else {
                    alert('Incorrect Username or Password!');
                }
            };

            const handleSendChatMessage = async (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                await supabaseClient.from('internal_messages').insert([
                    { sender: currentUser.username, sender_role: currentUser.role, message: chatInput }
                ]);
                setChatInput('');
                fetchChatMessages();
            };

            const handleCreateTeam = async (e) => {
                e.preventDefault();
                if (!teamUser || !teamPass) return alert('Fill required fields!');
                
                const { error } = await supabaseClient.from('team_accounts').insert([
                    { username: teamUser, password: teamPass, role: 'team' }
                ]);

                if (!error) {
                    alert(`Team account '${teamUser}' created!`);
                    setTeamUser(''); setTeamPass('');
                    fetchTeamUsers();
                } else {
                    alert('Error creating user or username already exists!');
                }
            };

            const handleDeleteTeamUser = async (userToDelete) => {
                if (userToDelete.role === 'admin') return alert("Admin account cannot be deleted!");
                if (confirm(`Delete account '${userToDelete.username}'?`)) {
                    await supabaseClient.from('team_accounts').delete().eq('username', userToDelete.username);
                    fetchTeamUsers();
                }
            };

            const handleChangeAdminPassword = async (e) => {
                e.preventDefault();
                if (secKeyInput !== SECURITY_KEY) {
                    return alert("Incorrect Security Key! Password not changed.");
                }
                if (!newAdminPass) return alert("Enter a new password!");

                const { error } = await supabaseClient
                    .from('team_accounts')
                    .update({ password: newAdminPass })
                    .eq('role', 'admin');

                if (!error) {
                    alert("Admin password updated successfully!");
                    setSecKeyInput(''); setNewAdminPass('');
                    fetchTeamUsers();
                } else {
                    alert("Failed to update password.");
                }
            };

            const handleSaveDiscount = async (prodId) => {
                const conf = discountInputs[prodId] || {};
                const percent = parseInt(conf.percent) || 0;
                const dateVal = conf.date || null;

                await supabaseClient
                    .from('products')
                    .update({ discount_percent: percent, discount_valid_until: dateVal })
                    .eq('id', prodId);

                fetchProducts();
                alert(`Discount of ${percent}% updated!`);
            };

            const handleRemoveDiscount = async (prodId) => {
                await supabaseClient
                    .from('products')
                    .update({ discount_percent: 0, discount_valid_until: null })
                    .eq('id', prodId);

                fetchProducts();
                alert("Discount removed!");
            };

            const updateOrderStatus = async (orderId, newStatus) => {
                await supabaseClient.from('orders').update({ payment_status: newStatus }).eq('id', orderId);
                fetchOrders();
            };

            const updateReportStatus = async (reportId, newStatus) => {
                await supabaseClient.from('reports').update({ status: newStatus }).eq('id', reportId);
                fetchReports();
            };

            const updateHumanStatus = async (humanId, newStatus) => {
                await supabaseClient.from('human_contacts').update({ status: newStatus }).eq('id', humanId);
                fetchHumanContacts();
            };

            const deleteOrder = async (orderId) => {
                if (confirm(`Delete Order #${orderId}?`)) {
                    await supabaseClient.from('orders').delete().eq('id', orderId);
                    fetchOrders();
                }
            };

            const handleAddProduct = async (e) => {
                e.preventDefault();
                if (!newName || !newPrice || !newStock) return alert("Fill required fields!");

                if (currentUser.role === 'team') {
                    await supabaseClient.from('stock_approvals').insert([{
                        type: 'NEW_PRODUCT',
                        request_by: currentUser.username,
                        product_data: { name: newName, description: newDesc, price: parseFloat(newPrice), stock: parseInt(newStock) }
                    }]);
                    alert("Subscription request sent to Admin for approval!");
                } else {
                    await supabaseClient.from('products').insert([
                        { name: newName, description: newDesc, price: parseFloat(newPrice), stock: parseInt(newStock) }
                    ]);
                    fetchProducts();
                }
                setNewName(''); setNewDesc(''); setNewPrice(''); setNewStock('');
                fetchApprovals();
            };

            const updateStock = async (id, currentStock, delta, prodName) => {
                const targetStock = Math.max(0, currentStock + delta);
                if (currentUser.role === 'team') {
                    await supabaseClient.from('stock_approvals').insert([{
                        type: 'STOCK_CHANGE',
                        request_by: currentUser.username,
                        product_id: id,
                        product_name: prodName,
                        new_stock: targetStock
                    }]);
                    alert("Stock update request sent to Admin for approval!");
                } else {
                    await supabaseClient.from('products').update({ stock: targetStock }).eq('id', id);
                    fetchProducts();
                }
                fetchApprovals();
            };

            const handleRequestDeleteProduct = async (item) => {
                if (currentUser.role === 'team') {
                    await supabaseClient.from('stock_approvals').insert([{
                        type: 'DELETE_PRODUCT',
                        request_by: currentUser.username,
                        product_id: item.id,
                        product_name: item.name
                    }]);
                    alert("Delete product request sent to Admin!");
                    fetchApprovals();
                } else {
                    deleteProduct(item.id);
                }
            };

            const handleApprove = async (approvalItem) => {
                if (approvalItem.type === 'NEW_PRODUCT') {
                    await supabaseClient.from('products').insert([approvalItem.product_data]);
                } else if (approvalItem.type === 'STOCK_CHANGE') {
                    await supabaseClient.from('products').update({ stock: approvalItem.new_stock }).eq('id', approvalItem.product_id);
                } else if (approvalItem.type === 'DELETE_PRODUCT') {
                    await supabaseClient.from('products').delete().eq('id', approvalItem.product_id);
                }

                await supabaseClient.from('stock_approvals').delete().eq('id', approvalItem.id);
                fetchProducts();
                fetchApprovals();
            };

            const handleReject = async (approvalId) => {
                await supabaseClient.from('stock_approvals').delete().eq('id', approvalId);
                fetchApprovals();
            };

            const deleteProduct = async (id) => {
                if (confirm('Delete this product permanently?')) {
                    await supabaseClient.from('products').delete().eq('id', id);
                    fetchProducts();
                }
            };

            const filteredOrders = orders.filter(order => {
                if (currentUser?.role === 'team' && order.payment_status === 'delivered') {
                    return false;
                }
                return (order.customer_phone && order.customer_phone.toLowerCase().includes(searchQuery.toLowerCase())) ||
                       (order.product_name && order.product_name.toLowerCase().includes(searchQuery.toLowerCase())) ||
                       (order.id && order.id.toString().includes(searchQuery));
            });

            const totalDeliveredRevenue = orders
                .filter(o => o.payment_status === 'delivered')
                .reduce((sum, o) => sum + (parseFloat(o.amount) || 0), 0);

            if (!currentUser) {
                return (
                    <div class="min-h-screen flex flex-col justify-between items-center px-4 py-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
                        <div></div>
                        <form onSubmit={handleLogin} class="bg-slate-900/90 backdrop-blur-2xl border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl shadow-emerald-950/20">
                            <div class="text-center mb-8">
                                <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">Suleman Digital Store</h1>
                                <p class="text-xs font-semibold text-slate-400 mt-2 tracking-wide uppercase">Executive Control Portal</p>
                            </div>
                            <div class="space-y-5">
                                <div>
                                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Username</label>
                                    <input type="text" value={usernameInput} onChange={e=>setUsernameInput(e.target.value)} class="w-full mt-1.5 p-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-white font-medium focus:border-emerald-500 focus:outline-none transition-all" placeholder="Username"/>
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Password</label>
                                    <input type="password" value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} class="w-full mt-1.5 p-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-white font-medium focus:border-emerald-500 focus:outline-none transition-all" placeholder="••••••••"/>
                                </div>
                                <button class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white py-4 rounded-2xl font-black tracking-wide shadow-lg shadow-emerald-900/30 transition-all transform active:scale-[0.98]">
                                    Login to Portal
                                </button>
                            </div>
                        </form>
                        <footer class="text-center text-xs text-slate-500 font-medium tracking-wide">
                            Made by <span class="font-bold text-slate-300">Digital Breach</span> | Contact: <a href="https://wa.me/923462809972" target="_blank" class="text-emerald-400 hover:underline font-mono">+923462809972</a>
                        </footer>
                    </div>
                );
            }

            return (
                <div class="min-h-screen flex flex-col justify-between bg-slate-950">
                    <div class="max-w-7xl mx-auto px-4 py-6 w-full">
                        {/* HEADER */}
                        <div class="flex justify-between items-center pb-6 border-b border-slate-800/80">
                            <div class="flex items-center space-x-3">
                                <h1 class="text-3xl font-black text-white tracking-tight">Suleman Digital Store</h1>
                                <span class={`text-[10px] px-3 py-1 rounded-full font-black uppercase tracking-wider ${currentUser.role === 'admin' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20'}`}>
                                    {currentUser.role === 'admin' ? 'Admin' : 'Team'}
                                </span>
                            </div>
                            <button onClick={() => setCurrentUser(null)} class="bg-slate-900 text-red-400 hover:bg-red-950/30 px-5 py-2.5 rounded-2xl text-xs font-bold border border-slate-800 transition-all">Logout ({currentUser.username})</button>
                        </div>

                        {currentUser.role === 'admin' && (
                            <div class="mt-6 bg-gradient-to-r from-emerald-950/60 via-slate-900 to-slate-900 border border-emerald-500/30 p-6 rounded-3xl flex justify-between items-center shadow-xl">
                                <div>
                                    <p class="text-xs font-bold text-emerald-400 uppercase tracking-widest">💰 Total Revenue (Delivered Orders)</p>
                                    <p class="text-4xl font-black text-white mt-1">Rs. {totalDeliveredRevenue.toLocaleString()}</p>
                                </div>
                            </div>
                        )}

                        {/* NAVIGATION TABS */}
                        <div class="flex space-x-3 mt-8 mb-6 border-b border-slate-800/80 pb-4 overflow-x-auto">
                            <button onClick={() => setActiveTab('orders')} class={`px-5 py-2.5 rounded-2xl text-xs font-extrabold transition-all ${activeTab === 'orders' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>🛒 Orders ({filteredOrders.length})</button>
                            <button onClick={() => setActiveTab('reports')} class={`px-5 py-2.5 rounded-2xl text-xs font-extrabold transition-all ${activeTab === 'reports' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>⚠️ Issue Reports ({reports.length})</button>
                            <button onClick={() => setActiveTab('human')} class={`px-5 py-2.5 rounded-2xl text-xs font-extrabold transition-all ${activeTab === 'human' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>💬 Human Support ({humanContacts.length})</button>
                            <button onClick={() => setActiveTab('products')} class={`px-5 py-2.5 rounded-2xl text-xs font-extrabold transition-all ${activeTab === 'products' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>📦 Stock</button>
                            <button onClick={() => setActiveTab('internal_chat')} class={`px-5 py-2.5 rounded-2xl text-xs font-extrabold transition-all ${activeTab === 'internal_chat' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>💬 Internal Chat ({chatMessages.length})</button>

                            {currentUser.role === 'admin' && (
                                <>
                                    <button onClick={() => setActiveTab('approvals')} class={`px-5 py-2.5 rounded-2xl text-xs font-extrabold transition-all relative ${activeTab === 'approvals' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>
                                        ⌛ Stock Approvals ({approvals.length})
                                        {approvals.length > 0 && <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold animate-pulse">{approvals.length}</span>}
                                    </button>
                                    <button onClick={() => setActiveTab('team')} class={`px-5 py-2.5 rounded-2xl text-xs font-extrabold transition-all ${activeTab === 'team' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'bg-slate-900 text-slate-400 hover:text-white'}`}>👥 Team Accounts</button>
                                </>
                            )}
                        </div>

                        {/* STOCK APPROVALS TAB */}
                        {activeTab === 'approvals' && currentUser.role === 'admin' && (
                            <div class="bg-slate-900 rounded-3xl border border-slate-800 p-6 shadow-xl space-y-4">
                                <h3 class="text-xs font-extrabold text-emerald-400 uppercase tracking-wider">Pending Stock Requests ({approvals.length})</h3>
                                {approvals.length === 0 ? (
                                    <p class="text-xs text-slate-500 py-4">No pending stock requests from team members.</p>
                                ) : (
                                    <div class="space-y-3">
                                        {approvals.map(a => (
                                            <div key={a.id} class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                                                <div>
                                                    <span class="font-bold text-cyan-400">[{a.request_by}]</span>{' '}
                                                    {a.type === 'NEW_PRODUCT' && <span>Requested to ADD product: <b>{a.product_data?.name}</b> (Price: Rs. {a.product_data?.price}, Stock: {a.product_data?.stock})</span>}
                                                    {a.type === 'STOCK_CHANGE' && <span>Requested STOCK UPDATE for <b>{a.product_name}</b> to <b>{a.new_stock}</b></span>}
                                                    {a.type === 'DELETE_PRODUCT' && <span>Requested DELETE for product <b>{a.product_name}</b></span>}
                                                </div>
                                                <div class="space-x-2">
                                                    <button onClick={() => handleApprove(a)} class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-xl font-bold transition-all">Approve</button>
                                                    <button onClick={() => handleReject(a.id)} class="bg-red-600 hover:bg-red-500 text-white px-4 py-1.5 rounded-xl font-bold transition-all">Reject</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* INTERNAL CHAT TAB */}
                        {activeTab === 'internal_chat' && (
                            <div class="bg-slate-900 rounded-3xl border border-slate-800 p-6 shadow-xl flex flex-col h-[500px]">
                                <h3 class="text-xs font-extrabold text-emerald-400 uppercase tracking-wider mb-4 border-b border-slate-800 pb-3">💬 Team & Admin Conversation Room</h3>
                                <div class="flex-1 overflow-y-auto space-y-3 pr-2 mb-4">
                                    {chatMessages.length === 0 ? (
                                        <p class="text-xs text-slate-500 py-4 text-center">No messages yet. Start a conversation below.</p>
                                    ) : (
                                        chatMessages.map(msg => (
                                            <div key={msg.id} class={`p-3.5 rounded-2xl max-w-xl text-xs border ${msg.sender === currentUser.username ? 'bg-emerald-950/40 border-emerald-500/30 ml-auto' : 'bg-slate-950 border-slate-800 mr-auto'}`}>
                                                <div class="flex justify-between items-center mb-1">
                                                    <span class="font-bold text-cyan-400">{msg.sender} <span class="text-[9px] text-slate-500 uppercase">({msg.sender_role})</span></span>
                                                    <span class="text-[9px] text-slate-500">{new Date(msg.created_at).toLocaleTimeString()}</span>
                                                </div>
                                                <p class="text-slate-200">{msg.message}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <form onSubmit={handleSendChatMessage} class="flex space-x-3">
                                    <input type="text" placeholder="Type message for team or admin..." value={chatInput} onChange={e=>setChatInput(e.target.value)} class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 text-xs text-white focus:outline-none focus:border-emerald-500"/>
                                    <button type="submit" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-6 py-2.5 rounded-2xl text-xs font-black transition-all">Send</button>
                                </form>
                            </div>
                        )}

                        {/* ORDERS TAB */}
                        {activeTab === 'orders' && (
                            <div class="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-xl">
                                <table class="w-full text-left text-xs text-slate-300">
                                    <thead class="bg-slate-950/80 text-slate-400 uppercase font-extrabold text-[10px] tracking-wider">
                                        <tr>
                                            <th class="p-4">Order ID</th>
                                            <th class="p-4">Date & Time</th>
                                            <th class="p-4">Customer WhatsApp</th>
                                            <th class="p-4">Product Details</th>
                                            {currentUser.role === 'admin' && <th class="p-4">Amount</th>}
                                            <th class="p-4">Payment Status</th>
                                            <th class="p-4 text-center">Change Status</th>
                                            <th class="p-4 text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800/80">
                                        {filteredOrders.map(order => (
                                            <tr key={order.id} class="hover:bg-slate-800/30 transition-colors">
                                                <td class="p-4 font-mono font-bold text-emerald-400">#{order.id}</td>
                                                <td class="p-4 text-slate-400">{order.created_at ? new Date(order.created_at).toLocaleString() : 'N/A'}</td>
                                                <td class="p-4 font-bold text-white">{order.customer_phone}</td>
                                                <td class="p-4">{order.product_name}</td>
                                                {currentUser.role === 'admin' && <td class="p-4 font-bold text-emerald-400">Rs. {order.amount}</td>}
                                                <td class="p-4"><span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">{order.payment_status}</span></td>
                                                <td class="p-4 text-center">
                                                    <select value={order.payment_status} onChange={(e) => updateOrderStatus(order.id, e.target.value)} class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
                                                        <option value="pending">Pending</option>
                                                        <option value="paid">Paid</option>
                                                        <option value="delivered">Delivered</option>
                                                        <option value="cancelled">Cancelled</option>
                                                    </select>
                                                </td>
                                                <td class="p-4 text-right">
                                                    <button onClick={() => deleteOrder(order.id)} class="text-red-400 font-semibold hover:underline">Delete</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* REPORTS TAB */}
                        {activeTab === 'reports' && (
                            <div class="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-xl">
                                <table class="w-full text-left text-xs text-slate-300">
                                    <thead class="bg-slate-950/80 text-slate-400 uppercase font-extrabold text-[10px] tracking-wider">
                                        <tr>
                                            <th class="p-4">Ticket #</th>
                                            <th class="p-4">Customer WhatsApp</th>
                                            <th class="p-4">Issue Description</th>
                                            <th class="p-4">Date & Time</th>
                                            <th class="p-4 text-center">Status</th>
                                            <th class="p-4 text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800/80">
                                        {reports.map(r => (
                                            <tr key={r.id} class="hover:bg-slate-800/30 transition-colors">
                                                <td class="p-4 font-bold text-yellow-400">#{r.ticket_number || `REP-${r.id}`}</td>
                                                <td class="p-4 font-bold text-white">{r.customer_phone}</td>
                                                <td class="p-4 text-slate-200">{r.issue_details}</td>
                                                <td class="p-4 text-slate-400">{new Date(r.created_at).toLocaleString()}</td>
                                                <td class="p-4 text-center">
                                                    <select value={r.status || 'Pending'} onChange={(e) => updateReportStatus(r.id, e.target.value)} class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
                                                        <option value="Pending">Pending</option>
                                                        <option value="In Progress">In Progress</option>
                                                        <option value="Solved">Solved</option>
                                                    </select>
                                                </td>
                                                <td class="p-4 text-right">
                                                    <a href={`https://wa.me/${r.customer_phone}`} target="_blank" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 rounded-xl text-white font-bold inline-block transition-all">Reply Customer</a>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* HUMAN SUPPORT TAB */}
                        {activeTab === 'human' && (
                            <div class="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-xl">
                                <table class="w-full text-left text-xs text-slate-300">
                                    <thead class="bg-slate-950/80 text-slate-400 uppercase font-extrabold text-[10px] tracking-wider">
                                        <tr>
                                            <th class="p-4">Ticket #</th>
                                            <th class="p-4">Customer WhatsApp</th>
                                            <th class="p-4">Message</th>
                                            <th class="p-4">Date & Time</th>
                                            <th class="p-4 text-center">Status</th>
                                            <th class="p-4 text-right">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800/80">
                                        {humanContacts.map(h => (
                                            <tr key={h.id} class="hover:bg-slate-800/30 transition-colors">
                                                <td class="p-4 font-bold text-cyan-400">#{h.ticket_number || `HUM-${h.id}`}</td>
                                                <td class="p-4 font-bold text-white">{h.customer_phone}</td>
                                                <td class="p-4 text-slate-200">{h.message}</td>
                                                <td class="p-4 text-slate-400">{new Date(h.created_at).toLocaleString()}</td>
                                                <td class="p-4 text-center">
                                                    <select value={h.status || 'Pending'} onChange={(e) => updateHumanStatus(h.id, e.target.value)} class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none">
                                                        <option value="Pending">Pending</option>
                                                        <option value="In Progress">In Progress</option>
                                                        <option value="Solved">Solved</option>
                                                    </select>
                                                </td>
                                                <td class="p-4 text-right">
                                                    <a href={`https://wa.me/${h.customer_phone}`} target="_blank" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 rounded-xl text-white font-bold inline-block transition-all">Chat on WhatsApp</a>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* STOCK TAB */}
                        {activeTab === 'products' && (
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 h-fit shadow-xl">
                                    <h3 class="text-xs font-extrabold mb-4 text-emerald-400 uppercase tracking-wider">
                                        {currentUser.role === 'team' ? 'Request New Subscription' : 'Add New Subscription'}
                                    </h3>
                                    <form onSubmit={handleAddProduct} class="space-y-4 text-xs">
                                        <input type="text" placeholder="Title" value={newName} onChange={e=>setNewName(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-white focus:outline-none focus:border-emerald-500"/>
                                        <input type="text" placeholder="Description" value={newDesc} onChange={e=>setNewDesc(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-white focus:outline-none focus:border-emerald-500"/>
                                        <div class="grid grid-cols-2 gap-4">
                                            <input type="number" placeholder="Price" value={newPrice} onChange={e=>setNewPrice(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-white focus:outline-none focus:border-emerald-500"/>
                                            <input type="number" placeholder="Stock" value={newStock} onChange={e=>setNewStock(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-white focus:outline-none focus:border-emerald-500"/>
                                        </div>
                                        <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold py-3.5 rounded-2xl transition-all">
                                            {currentUser.role === 'team' ? 'Submit for Approval' : 'Save Subscription'}
                                        </button>
                                    </form>
                                </div>
                                <div class="lg:col-span-2 bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl overflow-x-auto">
                                    <table class="w-full text-left text-xs text-slate-300">
                                        <thead class="bg-slate-950/80 text-slate-400 uppercase text-[10px] tracking-wider">
                                            <tr>
                                                <th class="p-3">Title</th>
                                                <th class="p-3">Price</th>
                                                <th class="p-3 text-center">Stock</th>
                                                {currentUser.role === 'admin' && <th class="p-3">Discount % & Date</th>}
                                                <th class="p-3 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800/80">
                                            {products.map(item => (
                                                <tr key={item.id} class="hover:bg-slate-800/30 transition-colors">
                                                    <td class="p-3 font-medium text-white">
                                                        {item.name}
                                                        {item.discount_percent > 0 && (
                                                            <span class="ml-2 px-2 py-0.5 rounded-full text-[9px] font-black bg-red-500/20 text-red-400 border border-red-500/30">
                                                                🔥 {item.discount_percent}% OFF
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td class="p-3 text-emerald-400 font-bold">Rs. {item.price}</td>
                                                    <td class="p-3 text-center">
                                                        <button onClick={() => updateStock(item.id, item.stock, -1, item.name)} class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-xl transition-all">-</button>
                                                        <span class="mx-3 font-bold">{item.stock}</span>
                                                        <button onClick={() => updateStock(item.id, item.stock, 1, item.name)} class="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-xl transition-all">+</button>
                                                    </td>
                                                    {currentUser.role === 'admin' && (
                                                        <td class="p-3">
                                                            <div class="flex items-center space-x-2">
                                                                <input type="number" placeholder="%" value={discountInputs[item.id]?.percent ?? (item.discount_percent || '')} onChange={e => setDiscountInputs({ ...discountInputs, [item.id]: { ...discountInputs[item.id], percent: e.target.value } })} class="w-12 bg-slate-950 border border-slate-800 rounded-xl p-1.5 text-center text-white focus:outline-none"/>
                                                                <input type="date" value={discountInputs[item.id]?.date ?? (item.discount_valid_until || '')} onChange={e => setDiscountInputs({ ...discountInputs, [item.id]: { ...discountInputs[item.id], date: e.target.value } })} class="bg-slate-950 border border-slate-800 rounded-xl p-1.5 text-white text-[10px] focus:outline-none"/>
                                                                <button onClick={() => handleSaveDiscount(item.id)} class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-xl font-bold text-[10px]">Save</button>
                                                                {item.discount_percent > 0 && (
                                                                    <button onClick={() => handleRemoveDiscount(item.id)} class="bg-red-600/30 text-red-400 border border-red-500/30 px-2 py-1 rounded-xl text-[10px] font-bold">Remove</button>
                                                                )}
                                                            </div>
                                                        </td>
                                                    )}
                                                    <td class="p-3 text-right">
                                                        {currentUser.role === 'team' ? (
                                                            <button onClick={() => handleRequestDeleteProduct(item)} class="text-yellow-400 font-semibold hover:underline">Request Delete</button>
                                                        ) : (
                                                            <button onClick={() => deleteProduct(item.id)} class="text-red-400 font-semibold hover:underline">Delete</button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TEAM MANAGEMENT TAB */}
                        {activeTab === 'team' && currentUser.role === 'admin' && (
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="space-y-6">
                                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                        <h3 class="text-xs font-extrabold mb-4 text-emerald-400 uppercase tracking-wider">Create Team Account</h3>
                                        <form onSubmit={handleCreateTeam} class="space-y-4 text-xs">
                                            <input type="text" placeholder="Username" value={teamUser} onChange={e=>setTeamUser(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-white focus:outline-none focus:border-emerald-500"/>
                                            <input type="password" placeholder="Password" value={teamPass} onChange={e=>setTeamPass(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-white focus:outline-none focus:border-emerald-500"/>
                                            <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold py-3.5 rounded-2xl transition-all">Create Account</button>
                                        </form>
                                    </div>

                                    <div class="bg-slate-900 p-6 rounded-3xl border border-red-900/40 shadow-xl">
                                        <h3 class="text-xs font-extrabold mb-2 text-red-400 uppercase tracking-wider">🔐 Change Admin Password</h3>
                                        <p class="text-[10px] text-slate-400 mb-4">Requires Master Security Key</p>
                                        <form onSubmit={handleChangeAdminPassword} class="space-y-4 text-xs">
                                            <input type="password" placeholder="Security Key" value={secKeyInput} onChange={e=>setSecKeyInput(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-white focus:outline-none focus:border-red-500"/>
                                            <input type="password" placeholder="New Admin Password" value={newAdminPass} onChange={e=>setNewAdminPass(e.target.value)} class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-white focus:outline-none focus:border-red-500"/>
                                            <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-extrabold py-3.5 rounded-2xl transition-all">Update Password</button>
                                        </form>
                                    </div>
                                </div>

                                <div class="lg:col-span-2 bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <h3 class="text-xs font-extrabold mb-4 text-slate-300 uppercase tracking-wider">Existing Dashboard Users</h3>
                                    <table class="w-full text-left text-xs text-slate-300">
                                        <thead class="bg-slate-950/80 text-slate-400 uppercase text-[10px] tracking-wider">
                                            <tr>
                                                <th class="p-3">Username</th>
                                                <th class="p-3">Role</th>
                                                <th class="p-3 text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800/80">
                                            {teamUsers.map((u, i) => (
                                                <tr key={i} class="hover:bg-slate-800/30 transition-colors">
                                                    <td class="p-3 font-medium text-white">{u.username}</td>
                                                    <td class="p-3 uppercase font-bold text-emerald-400">{u.role}</td>
                                                    <td class="p-3 text-right">
                                                        {u.role !== 'admin' && (
                                                            <button onClick={() => handleDeleteTeamUser(u)} class="text-red-400 font-semibold hover:underline">Delete Account</button>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    <footer class="mt-12 py-4 bg-slate-950 border-t border-slate-900 text-center text-xs text-slate-500 font-medium tracking-wide">
                        Made by <span class="font-bold text-slate-300">Digital Breach</span> | Contact: <a href="https://wa.me/923462809972" target="_blank" class="text-emerald-400 hover:underline font-mono">+923462809972</a>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
